name: playit-docker-web
services:
  playit:
    image: wisdomsky/playit-docker-web:2.0.2@sha256:4674d51873195937bba52ffa410f23c6ce1f6144fda3907f7318e6ad17c0bee4
    restart: unless-stopped
    network_mode: host
    ports:
      - target: 8008
        published: "8008"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/playit-docker-web/config
        target: /config
x-casaos:
  main: playit
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.playit-docker-web/assets/icon.png
  title:
    en_US: Playit.gg
  port_map: "8008"
  id: com.wisdomsky.coolstore.playit-docker-web
  index: /
  scheme: http
  version: 2.0.2
