name: homebridge
services:
  app:
    image: oznu/homebridge:2023-01-08@sha256:6bcdb6735063be3b63013eb9b4f1a7406150412a5c0f60f472f78f1f3346d51f
    restart: unless-stopped
    environment:
      PGID: $PGID
      PUID: $PUID
      ENABLE_AVAHI: 1
      TZ: $TZ
    network_mode: host
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /homebridge
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.homebridge/assets/icon.png
  title:
    en_US: Homebridge
  port_map: "8581"
  id: com.wisdomsky.coolstore.homebridge
  index: /
  scheme: http
  version: "2023-01-08"
