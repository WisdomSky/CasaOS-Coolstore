name: hestiacp
services:
  app:
    image: dddmmm/hestiacp:1.10.5.2@sha256:c0f9c1d2f7d622275909789d3e3664b0be9a19ef0e83bbfa2eb642ce25f33f8f
    hostname: hestia.localhost
    restart: unless-stopped
    privileged: true
    depends_on:
      - mariadb
    environment:
      MAIL_ADMIN: admin@hestia.localhost
      AUTOSTART_DISABLED: clamav-daemon
    ports:
      - target: 8083
        published: 8083
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/hestiacp/backup
        target: /backup
      - type: bind
        source: /DATA/AppData/hestiacp/conf
        target: /conf
      - type: bind
        source: /DATA/AppData/hestiacp/home
        target: /home
      - type: bind
        source: /DATA/AppData/hestiacp/mariadb-logs
        target: /var/log/mysql
  mariadb:
    image: mariadb:10.11.19@sha256:6c65a843396dc6c78dd0da19eccaa0a91d25d9d26a4c2afcb75010ac3f59f5ea
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_ROOT_HOST: "%"
      MARIADB_INITDB_SKIP_TZINFO: 1
    command:
      - mariadbd
      - "--max-connections=1000"
      - "--max-user-connections=150"
      - "--max-allowed-packet=128M"
    volumes:
      - type: bind
        source: /DATA/AppData/hestiacp/mariadb
        target: /var/lib/mysql
      - type: bind
        source: /DATA/AppData/hestiacp/mariadb-logs
        target: /var/log/mysql
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.hestiacp/assets/icon.png
  title:
    en_US: Hestia CP
  id: com.wisdomsky.coolstore.hestiacp
  index: /
  port_map: "8083"
  scheme: http
  version: 1.10.5.2
