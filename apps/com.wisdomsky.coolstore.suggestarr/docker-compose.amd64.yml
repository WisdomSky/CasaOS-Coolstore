name: suggestarr
services:
  app:
    image: ciuse99/suggestarr:v3.3.0@sha256:97770bf3699c83dad91bda85ac0e5998212255ebfbeacc93f5b92d14873d95ae
    restart: unless-stopped
    ports:
      - target: 4455
        published: "4455"
        protocol: tcp
    environment:
      SUGGESTARR_PORT: "4455"
      LOG_LEVEL: INFO
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/suggestarr/config_files
        target: /app/config/config_files
    healthcheck:
      test:
        - CMD
        - python
        - "-c"
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:4455/api/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.suggestarr/assets/icon.png
  title:
    en_US: SuggestArr
  id: com.wisdomsky.coolstore.suggestarr
  index: /
  port_map: "4455"
  scheme: http
  version: 3.3.0
