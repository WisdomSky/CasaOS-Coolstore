name: freescout
services:
  app:
    image: nfrastack/freescout:2.2.22@sha256:4e39be0ea399e4244309492611023b29ef09efbc7cbc7dd5bafd50bc22d9bd57
    restart: unless-stopped
    ports:
      - target: 80
        published: "8080"
        protocol: tcp
    environment:
      CONTAINER_NAME: freescout-app
      TIMEZONE: $TZ
      APP_URL: http://localhost:8080
      DB_TYPE: mariadb
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: freescout
      DB_USER: freescout
      DB_PASS: casaos
      ADMIN_EMAIL: admin@example.com
      ADMIN_FIRST_NAME: FreeScout
      ADMIN_LAST_NAME: Admin
      ADMIN_PASS: casaos
      SCHEDULER_TYPE: service
      FREESCOUT_APP_LOCALE: en
      FREESCOUT_MAIL_DRIVER: log
    volumes:
      - type: bind
        source: /DATA/AppData/freescout/data
        target: /data
      - type: bind
        source: /DATA/AppData/freescout/logs
        target: /logs
    depends_on:
      - db
  db:
    image: mariadb:11.8.9@sha256:8a4a99eff981d95c3ab12d019b82fe59725fb7761f1f9a5f155bc3f025528f4f
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: casaos
      MARIADB_DATABASE: freescout
      MARIADB_USER: freescout
      MARIADB_PASSWORD: casaos
    volumes:
      - type: bind
        source: /DATA/AppData/freescout/db
        target: /var/lib/mysql
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.freescout/assets/icon.png
  title:
    en_US: FreeScout
  id: com.wisdomsky.coolstore.freescout
  index: /
  port_map: "8080"
  scheme: http
  version: 2.2.22
