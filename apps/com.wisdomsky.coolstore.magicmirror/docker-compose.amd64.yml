name: magicmirror
services:
  app:
    image: karsten13/magicmirror:alpine-v2.38.0@sha256:01195e9d6fe99a88ef8722746c3b183a8e6bafcfe84e7a3b024c5ec84ae30a3e
    restart: unless-stopped
    ports:
      - target: 8080
        published: "8080"
        protocol: tcp
    environment:
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/magicmirror/config
        target: /opt/magic_mirror/config
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.magicmirror/assets/icon.svg
  title:
    en_US: MagicMirror²
  id: com.wisdomsky.coolstore.magicmirror
  index: /
  port_map: "8080"
  scheme: http
  version: 2.38.0
