name: wg-easy
services:
  app:
    image: ghcr.io/wg-easy/wg-easy:15.5.0@sha256:4d19a233a70d519d60f55f7e2cf67da45ccdd4f32a20b4c73ca012580785f8ed
    environment:
      WG_HOST: 0.0.0.0
      PASSWORD: casaos
      WG_PORT: 51820
      WG_DEFAULT_DNS: 1.1.1.1
      WG_PERSISTENT_KEEPALIVE: 0
      WG_MTU:
    ports:
      - target: 51820
        published: 51820
        protocol: udp
      - target: 51821
        published: 51821
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/wireguard
        target: /etc/wireguard
    cap_add:
      - SYS_MODULE
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.wg-easy/assets/icon.png
  title:
    en_US: Wireguard Server
  port_map: "51821"
  id: com.wisdomsky.coolstore.wg-easy
  index: /
  scheme: http
  version: 15.5.0
