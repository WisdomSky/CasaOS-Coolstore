name: joomla
services:
  app:
    image: joomla:5.4-apache@sha256:c41684880a11149e4ff40e215f7116d441e8461d4529fb6a0fe08a8447c22d37
    environment:
      JOOMLA_DB_HOST: joomladb
      JOOMLA_DB_USER: joomla
      JOOMLA_DB_PASSWORD: casaos
      JOOMLA_DB_NAME: joomla
    depends_on:
      - joomladb
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/www
        target: /var/www/html
  joomladb:
    image: mysql:8.4.13@sha256:f0c7a4430d773ef8433aae82e08cb02ade4a6ad806a18b1610a48a1728fbdfd5
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: casaos
      MYSQL_DATABASE: joomla
      MYSQL_USER: joomla
      MYSQL_PASSWORD: casaos
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/mysql
        target: /var/lib/mysql
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.joomla/assets/icon.png
  title:
    en_US: Joomla
  port_map: "80"
  id: com.wisdomsky.coolstore.joomla
  index: /
  scheme: http
  version: 5.4-apache
