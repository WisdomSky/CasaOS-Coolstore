name: joomla
services:
  app:
    image: joomla:5.4-apache@sha256:f96e5ffa3d7c268e69d78902b779986345e828926a6c2bdb38c333871125cb7e
    environment:
      JOOMLA_DB_HOST: joomladb
      JOOMLA_DB_USER: joomla
      JOOMLA_DB_PASSWORD: casaos
      JOOMLA_DB_NAME: joomla
    depends_on:
      - joomladb
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/www
        target: /var/www/html
  joomladb:
    image: mysql:8.4.13@sha256:72c368d898861f3b3a07af0e6d690400f44f048799ed46822783d9224cc2c86d
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: casaos
      MYSQL_DATABASE: joomla
      MYSQL_USER: joomla
      MYSQL_PASSWORD: casaos
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/mysql
        target: /var/lib/mysql
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.joomla/assets/icon.png
  title:
    en_US: Joomla
  port_map: "80"
  id: com.wisdomsky.coolstore.joomla
  index: /
  scheme: http
  version: 5.4-apache
