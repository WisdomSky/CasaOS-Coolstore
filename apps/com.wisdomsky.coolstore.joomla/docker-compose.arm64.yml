name: joomla
services:
  app:
    image: joomla:5.4-apache@sha256:ab5451f960d46f825034fde6819733942c848750849e4f63865464998f304254
    environment:
      JOOMLA_DB_HOST: joomladb
      JOOMLA_DB_USER: joomla
      JOOMLA_DB_PASSWORD: casaos
      JOOMLA_DB_NAME: joomla
    depends_on:
      - joomladb
    ports:
      - target: 80
        published: 80
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/www
        target: /var/www/html
  joomladb:
    image: mysql:8.4.13@sha256:ca75bd73d5bdbd296b5a2136f5b9cc24ef59e79231dfd7cd86b05a075bb0f2b5
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: casaos
      MYSQL_DATABASE: joomla
      MYSQL_USER: joomla
      MYSQL_PASSWORD: casaos
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/mysql
        target: /var/lib/mysql
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.joomla/assets/icon.png
  title:
    en_US: Joomla
  port_map: "80"
  id: com.wisdomsky.coolstore.joomla
  index: /
  scheme: http
  version: 5.4-apache
