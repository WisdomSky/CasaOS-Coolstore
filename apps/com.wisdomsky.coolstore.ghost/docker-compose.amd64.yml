name: ghost
services:
  app:
    image: ghost:6.78.0@sha256:777321033467cd7ce7213b1af51a0bc66d28bb13859541b3c988e3e9fddcc45a
    environment:
      database__client: mysql
      database__connection__host: db
      database__connection__user: casaos
      database__connection__password: casaos
      database__connection__database: casaos
    ports:
      - target: 2368
        published: 2368
        protocol: tcp
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: /DATA/AppData/ghost/content
        target: /var/lib/ghost/content
  db:
    image: mariadb:10.6.28@sha256:883b61c61aaa82e0d98c909db914ccd107558c9e49e06b6624c2c48ffa3afcda
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: casaos
      MYSQL_DATABASE: casaos
      MYSQL_USER: casaos
      MYSQL_PASSWORD: casaos
    volumes:
      - type: bind
        source: /DATA/AppData/ghost/mysql
        target: /var/lib/mysql
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - "--connect"
        - "--innodb_initialized"
      interval: 10s
      timeout: 5s
      retries: 3
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.ghost/assets/icon.png
  title:
    en_US: Ghost
  port_map: "2368"
  id: com.wisdomsky.coolstore.ghost
  index: /
  scheme: http
  version: 6.78.0
