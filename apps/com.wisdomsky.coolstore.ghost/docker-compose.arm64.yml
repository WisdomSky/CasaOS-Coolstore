name: ghost
services:
  app:
    image: ghost:6.73.0@sha256:b8fa072d012a3ddbb959e8e0da98b8b13f4c9850920da28fa456bcc1e0d58ab6
    environment:
      database__client: mysql
      database__connection__host: db
      database__connection__user: casaos
      database__connection__password: casaos
      database__connection__database: casaos
    ports:
      - target: 2368
        published: 2368
        protocol: tcp
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: /DATA/AppData/ghost/content
        target: /var/lib/ghost/content
  db:
    image: mariadb:13.0.2@sha256:6d882f903b25c6517caf5d14422ebfc371f4c34ebb8fd3c64320a6dc43c9271d
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: casaos
      MYSQL_DATABASE: casaos
      MYSQL_USER: casaos
      MYSQL_PASSWORD: casaos
    volumes:
      - type: bind
        source: /DATA/AppData/ghost/mysql
        target: /var/lib/mysql
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - "--connect"
        - "--innodb_initialized"
      interval: 10s
      timeout: 5s
      retries: 3
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.ghost/assets/icon.png
  title:
    en_US: Ghost
  port_map: "2368"
  id: com.wisdomsky.coolstore.ghost
  index: /
  scheme: http
  version: 6.73.0
