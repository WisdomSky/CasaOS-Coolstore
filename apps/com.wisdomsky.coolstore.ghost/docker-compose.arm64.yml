name: ghost
services:
  app:
    image: ghost:6.77.0@sha256:f564006935f4101a350e2666e2abe4068c393b2f7b9b59aa819c23cf4e5be7e5
    environment:
      database__client: mysql
      database__connection__host: db
      database__connection__user: casaos
      database__connection__password: casaos
      database__connection__database: casaos
    ports:
      - target: 2368
        published: 2368
        protocol: tcp
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - type: bind
        source: /DATA/AppData/ghost/content
        target: /var/lib/ghost/content
  db:
    image: mariadb:13.0.2@sha256:3339b0a9443f11155d966e3a5259641bd48acb0251fdc060744709a2a0408dde
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: casaos
      MYSQL_DATABASE: casaos
      MYSQL_USER: casaos
      MYSQL_PASSWORD: casaos
    volumes:
      - type: bind
        source: /DATA/AppData/ghost/mysql
        target: /var/lib/mysql
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - "--connect"
        - "--innodb_initialized"
      interval: 10s
      timeout: 5s
      retries: 3
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.ghost/assets/icon.png
  title:
    en_US: Ghost
  port_map: "2368"
  id: com.wisdomsky.coolstore.ghost
  index: /
  scheme: http
  version: 6.77.0
