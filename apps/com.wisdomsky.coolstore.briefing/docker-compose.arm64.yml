name: briefing
services:
  app:
    image: holtwick/briefing:3.1.10@sha256:64a10e90bfd1b00fc95bac11ff1dbe163771430b84d927a99f0e57d7a78adcc4
    restart: unless-stopped
    ports:
      - target: 8080
        published: "8080"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/briefing/data
        target: /app/data
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.briefing/assets/icon.png
  title:
    en_US: Briefing
  id: com.wisdomsky.coolstore.briefing
  index: /
  port_map: "8080"
  scheme: http
  version: 3.1.10
