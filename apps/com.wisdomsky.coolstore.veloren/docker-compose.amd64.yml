name: veloren
services:
  app:
    image: registry.gitlab.com/veloren/veloren/server-cli:weekly@sha256:f6e18eef417cbfb85a6cbff3eadf7544dfe995d46ff917aae16477e96c757598
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - target: 14004
        published: "14004"
        protocol: tcp
      - target: 14004
        published: "14004"
        protocol: udp
      - target: 14005
        published: "14005"
        protocol: tcp
      - target: 14006
        published: "14006"
        protocol: udp
    environment:
      RUST_LOG: debug,common::net=info
    volumes:
      - type: bind
        source: /DATA/AppData/veloren/userdata
        target: /opt/userdata
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.veloren/assets/icon.png
  title:
    en_US: Veloren Server
  id: com.wisdomsky.coolstore.veloren
  index: /
  port_map: "14004"
  version: weekly
