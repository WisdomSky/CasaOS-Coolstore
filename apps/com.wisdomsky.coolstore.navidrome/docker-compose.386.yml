name: coolstore-navidrome
services:
  navidrome:
    image: deluan/navidrome:0.64.2@sha256:c7e2fd3160472fa582a83597cffbece2ac51d84c96c6c22b7314f2d8d58e407c
    ports:
      - "4533:4533"
    restart: unless-stopped
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_BASEURL: ""
    volumes:
      - type: bind
        source: /DATA/AppData/coolstore-navidrome/data
        target: /data
      - type: bind
        source: /DATA/Media/Music
        target: /music
        read_only: true
x-casaos:
  main: navidrome
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.navidrome/assets/icon.jpg
  title:
    en_US: Navidrome
  port_map: "4533"
  id: com.wisdomsky.coolstore.navidrome
  index: /
  scheme: http
  version: 0.64.2
