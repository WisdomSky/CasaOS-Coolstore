name: metube-youtubedl
services:
  app:
    image: alexta69/metube:2025-07-30@sha256:e183e76eebc42e6b271166214ea2f54c894e54eee1bb6224f4d42a741fa73dd2
    restart: unless-stopped
    environment:
      UID: $PUID
      GID: $PGID
      DARK_MODE: true
    ports:
      - target: 8081
        published: 8081
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/downloads
        target: /downloads
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.metube-youtubedl/assets/icon.png
  title:
    en_US: Metube
  port_map: "8081"
  id: com.wisdomsky.coolstore.metube-youtubedl
  index: /
  scheme: http
  version: "2025-07-30"
