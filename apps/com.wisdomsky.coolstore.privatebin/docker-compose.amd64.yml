name: privatebin
services:
  app:
    image: privatebin/nginx-fpm-alpine:2.1.1@sha256:9f808790567ef99454319cfd0e056a09c3aff1d496033d1d58fa07e5ad8a268e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /srv/data
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /srv/cfg
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.privatebin/assets/icon.png
  title:
    en_US: Privatebin
  port_map: "8080"
  id: com.wisdomsky.coolstore.privatebin
  index: /
  scheme: http
  version: 2.1.1
