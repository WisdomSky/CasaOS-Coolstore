name: esphome
services:
  app:
    image: esphome/esphome:2026.10
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      USERNAME: casaos
      PASSWORD: casaos
    volumes:
      - type: bind
        source: /DATA/AppData/esphome/config
        target: /config
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.esphome/assets/icon
  title:
    en_US: ESPHome
  port_map: "6052"
  id: com.wisdomsky.coolstore.esphome
  index: /
  scheme: http
  version: "2026.10"
