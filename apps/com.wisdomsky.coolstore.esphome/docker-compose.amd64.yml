name: esphome
services:
  app:
    image: esphome/esphome:2026.11@sha256:5f21f83cedea47efe0099f96e88f4e040920d04fc7861e38191598310909c54e
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      USERNAME: casaos
      PASSWORD: casaos
    volumes:
      - type: bind
        source: /DATA/AppData/esphome/config
        target: /config
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.esphome/assets/icon
  title:
    en_US: ESPHome
  port_map: "6052"
  id: com.wisdomsky.coolstore.esphome
  index: /
  scheme: http
  version: "2026.11"
