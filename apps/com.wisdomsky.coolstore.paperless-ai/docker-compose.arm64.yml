name: paperless-ai
services:
  app:
    image: clusterzx/paperless-ai:4.4.0@sha256:dd9dc7deb525f875a7a55a646e45240853b7a3f412725b4fbb9bcce378068e38
    restart: unless-stopped
    ports:
      - target: 3000
        published: "3000"
        protocol: tcp
    environment:
      PUID: $PUID
      PGID: $PGID
      PAPERLESS_AI_PORT: "3000"
      TZ: $TZ
      PAPERLESS_API_URL: http://paperless-ngx:8000/api
      PAPERLESS_API_TOKEN: ""
      RAG_SERVICE_ENABLED: "false"
    volumes:
      - type: bind
        source: /DATA/AppData/paperless-ai/data
        target: /app/data
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.paperless-ai/assets/icon.png
  title:
    en_US: Paperless-AI
  id: com.wisdomsky.coolstore.paperless-ai
  index: /
  port_map: "3000"
  scheme: http
  version: 4.4.0
