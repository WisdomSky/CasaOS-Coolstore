name: paperless-ai
services:
  app:
    image: clusterzx/paperless-ai:4.0.0@sha256:a5179cccf83a0410426f27c9162d95a8c17d544be97a3f8899b41730ae7f75ea
    restart: unless-stopped
    ports:
      - target: 3000
        published: "3000"
        protocol: tcp
    environment:
      PUID: $PUID
      PGID: $PGID
      PAPERLESS_AI_PORT: "3000"
      TZ: $TZ
      PAPERLESS_API_URL: http://paperless-ngx:8000/api
      PAPERLESS_API_TOKEN: ""
      RAG_SERVICE_ENABLED: "false"
    volumes:
      - type: bind
        source: /DATA/AppData/paperless-ai/data
        target: /app/data
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.paperless-ai/assets/icon.png
  title:
    en_US: Paperless-AI
  id: com.wisdomsky.coolstore.paperless-ai
  index: /
  port_map: "3000"
  scheme: http
  version: 4.0.0
