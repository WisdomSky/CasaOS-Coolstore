name: paperless-ai
services:
  app:
    image: clusterzx/paperless-ai:4.5.2@sha256:c040a2607676665b42a3b218b7f5a9849f4be18efd8c2a7ef06f7fb0624a4e45
    restart: unless-stopped
    ports:
      - target: 3000
        published: "3000"
        protocol: tcp
    environment:
      PUID: $PUID
      PGID: $PGID
      PAPERLESS_AI_PORT: "3000"
      TZ: $TZ
      PAPERLESS_API_URL: http://paperless-ngx:8000/api
      PAPERLESS_API_TOKEN: ""
      RAG_SERVICE_ENABLED: "false"
    volumes:
      - type: bind
        source: /DATA/AppData/paperless-ai/data
        target: /app/data
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.paperless-ai/assets/icon.png
  title:
    en_US: Paperless-AI
  id: com.wisdomsky.coolstore.paperless-ai
  index: /
  port_map: "3000"
  scheme: http
  version: 4.5.2
