name: paperless-ai
services:
  app:
    image: clusterzx/paperless-ai:4.3.1@sha256:51fcb48ecf4ec778c40299c32db8ca42a924c952857a7b1d919c173e1463608e
    restart: unless-stopped
    ports:
      - target: 3000
        published: "3000"
        protocol: tcp
    environment:
      PUID: $PUID
      PGID: $PGID
      PAPERLESS_AI_PORT: "3000"
      TZ: $TZ
      PAPERLESS_API_URL: http://paperless-ngx:8000/api
      PAPERLESS_API_TOKEN: ""
      RAG_SERVICE_ENABLED: "false"
    volumes:
      - type: bind
        source: /DATA/AppData/paperless-ai/data
        target: /app/data
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.paperless-ai/assets/icon.png
  title:
    en_US: Paperless-AI
  id: com.wisdomsky.coolstore.paperless-ai
  index: /
  port_map: "3000"
  scheme: http
  version: 4.3.1
