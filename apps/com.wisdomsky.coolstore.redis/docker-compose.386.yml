name: redis
services:
  app:
    image: redis:8.8.4@sha256:8cc2f5d6c05b6c4e30d890d62b0179ceb7d3660dbe0815734d5a5ef90866df91
    restart: unless-stopped
    ports:
      - target: 6379
        published: "6379"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/redis/data
        target: /data
      - type: bind
        source: /DATA/AppData/redis/config
        target: /usr/local/etc/redis
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.redis/assets/icon.png
  title:
    en_US: Redis
  id: com.wisdomsky.coolstore.redis
  index: /
  port_map: "6379"
  version: 8.8.4
