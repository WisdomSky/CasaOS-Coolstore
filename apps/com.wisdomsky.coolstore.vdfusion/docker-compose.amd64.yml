name: vdfusion
services:
  app:
    image: ghcr.io/vsl86/vdfusion:v1.2.0@sha256:4235463cf6c1ff6620c18df7c2f02ca4c727cb87c5c23e0aa5426e28c3319df6
    restart: unless-stopped
    ports:
      - target: 8080
        published: "8080"
        protocol: tcp
    environment:
      VDF_DB_PATH: /app/storage/vdf.db
      VDF_LOG_LEVEL: info
      VDF_SERVER_ADDR: ":8080"
    volumes:
      - type: bind
        source: /DATA/AppData/vdfusion
        target: /app/storage
      - type: bind
        source: /DATA/Media
        target: /media
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.vdfusion/assets/icon.svg
  title:
    en_US: VDFusion
  id: com.wisdomsky.coolstore.vdfusion
  index: /
  port_map: "8080"
  scheme: http
  version: 1.2.0
