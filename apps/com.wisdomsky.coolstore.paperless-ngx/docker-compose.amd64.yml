name: paperless
services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.4.2@sha256:1856adaeccf1a3bfc58722767321888ee6ecbeeb7807ae5b0836d0f0a4ce3f25
    restart: unless-stopped
    depends_on:
      - db
      - broker
    ports:
      - "8005:8000"
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - http://localhost:8000
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - /DATA/AppData/paperless/data:/usr/src/paperless/data
      - /DATA/AppData/paperless/media:/usr/src/paperless/media
      - /DATA/AppData/paperless/export:/usr/src/paperless/export
      - /DATA/AppData/paperless/consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBENGINE: mariadb
      PAPERLESS_DBHOST: db
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: paperless
      PAPERLESS_DBPORT: 3306
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: admin
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
  broker:
    image: redis:8.8.4@sha256:f00c54d05acbb9f6b9ce47e3dbd03d7ed16d94c274470be17acd6b0112734162
    restart: unless-stopped
    volumes:
      - /DATA/AppData/paperless/redis/data:/data
  db:
    image: mariadb:13.0.2@sha256:4817c4f8ac0c9141f6fe42337ec256b7a88dc9461e37be725528688066567e9d
    restart: unless-stopped
    volumes:
      - /DATA/AppData/paperless/mysql:/var/lib/mysql
    environment:
      MARIADB_HOST: paperless
      MARIADB_DATABASE: paperless
      MARIADB_USER: paperless
      MARIADB_PASSWORD: paperless
      MARIADB_ROOT_PASSWORD: paperless
  tika:
    image: apache/tika:3.3.3.0@sha256:6d5d54af3439b2f73aae4c7cdec6b11d06d4665c3d8cf78ff4a8cf137f78ed21
    restart: unless-stopped
    ports:
      - "9998:9998"
  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.40@sha256:ed98b492e0c0fe7c70670724c1c03aa7f62f9740acb07d17cbd70b5e5b1410fb
    restart: unless-stopped
    command:
      - gotenberg
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    ports:
      - "3000:3000"
x-casaos:
  main: paperless
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.paperless-ngx/assets/icon
  title:
    en_US: Paperless-ngx
  port_map: "8005"
  id: com.wisdomsky.coolstore.paperless-ngx
  index: /
  scheme: http
  version: 3.4.2
