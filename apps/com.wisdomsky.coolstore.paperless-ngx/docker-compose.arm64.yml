name: paperless
services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.4.0@sha256:3fa917e6ffadeb67bfe19c22923f460d68d458a7bd452d037ec85cc83dcd7083
    restart: unless-stopped
    depends_on:
      - db
      - broker
    ports:
      - "8005:8000"
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - http://localhost:8000
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - /DATA/AppData/paperless/data:/usr/src/paperless/data
      - /DATA/AppData/paperless/media:/usr/src/paperless/media
      - /DATA/AppData/paperless/export:/usr/src/paperless/export
      - /DATA/AppData/paperless/consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBENGINE: mariadb
      PAPERLESS_DBHOST: db
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: paperless
      PAPERLESS_DBPORT: 3306
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: admin
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
  broker:
    image: redis:8.8.4@sha256:d26d35a822dd0052e85ea47b03e3993fadc06e919a0d260d5a7f2e199e6f801c
    restart: unless-stopped
    volumes:
      - /DATA/AppData/paperless/redis/data:/data
  db:
    image: mariadb:13.0.2@sha256:6d882f903b25c6517caf5d14422ebfc371f4c34ebb8fd3c64320a6dc43c9271d
    restart: unless-stopped
    volumes:
      - /DATA/AppData/paperless/mysql:/var/lib/mysql
    environment:
      MARIADB_HOST: paperless
      MARIADB_DATABASE: paperless
      MARIADB_USER: paperless
      MARIADB_PASSWORD: paperless
      MARIADB_ROOT_PASSWORD: paperless
  tika:
    image: apache/tika:3.3.3.0@sha256:4b4aa2700fd4d2c512f87839c2db1d10075bfec4f1cd90725487def9bf7d200a
    restart: unless-stopped
    ports:
      - "9998:9998"
  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.39@sha256:7d84f99323c1a9052f5d89881fcada68f8efcde32b64daf3c029f99cab23fd26
    restart: unless-stopped
    command:
      - gotenberg
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    ports:
      - "3000:3000"
x-casaos:
  main: paperless
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.paperless-ngx/assets/icon
  title:
    en_US: Paperless-ngx
  port_map: "8005"
  id: com.wisdomsky.coolstore.paperless-ngx
  index: /
  scheme: http
  version: 3.4.0
