name: paperless
services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.5.1@sha256:9738d423031f6b5beede002cdacae3be38fec9b144e71db7332ef76b27aac5d0
    restart: unless-stopped
    depends_on:
      - db
      - broker
    ports:
      - "8005:8000"
    healthcheck:
      test:
        - CMD
        - curl
        - "-f"
        - http://localhost:8000
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - /DATA/AppData/paperless/data:/usr/src/paperless/data
      - /DATA/AppData/paperless/media:/usr/src/paperless/media
      - /DATA/AppData/paperless/export:/usr/src/paperless/export
      - /DATA/AppData/paperless/consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBENGINE: mariadb
      PAPERLESS_DBHOST: db
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: paperless
      PAPERLESS_DBPORT: 3306
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: admin
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
  broker:
    image: redis:8.8.4@sha256:8f5017281533114d6e6c2be2b4baaf43695d37818f5ff4b423ccf2904aeb76ea
    restart: unless-stopped
    volumes:
      - /DATA/AppData/paperless/redis/data:/data
  db:
    image: mariadb:10.6@sha256:b65497131ccd25dbb1f7943e61285b3dc5296b3016359f5e033a902547ddd942
    restart: unless-stopped
    volumes:
      - /DATA/AppData/paperless/mysql:/var/lib/mysql
    environment:
      MARIADB_HOST: paperless
      MARIADB_DATABASE: paperless
      MARIADB_USER: paperless
      MARIADB_PASSWORD: paperless
      MARIADB_ROOT_PASSWORD: paperless
  tika:
    image: apache/tika:3.3.3.1@sha256:91c149698d9d5fd63baf67710af3559471c44cb5a8eb2c397c0fca8d07098e53
    restart: unless-stopped
    ports:
      - "9998:9998"
  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.40@sha256:a6bd7988a03b92de1eafca84d99b9a4a7bac8c3fd17d776cb17f2a6c322b4f92
    restart: unless-stopped
    command:
      - gotenberg
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    ports:
      - "3000:3000"
x-casaos:
  main: paperless
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.paperless-ngx/assets/icon
  title:
    en_US: Paperless-ngx
  port_map: "8005"
  id: com.wisdomsky.coolstore.paperless-ngx
  index: /
  scheme: http
  version: 3.5.1
