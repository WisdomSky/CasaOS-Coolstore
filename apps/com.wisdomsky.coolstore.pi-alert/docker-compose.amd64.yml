name: pi-alert
services:
  app:
    image: jokobsk/pi.alert:25@sha256:08993807bea9234365b79110da3f82d319ba9c40bb5c12ed43e226d9633b58e9
    restart: always
    network_mode: host
    environment:
      PUID: $PUID
      PGID: $PGID
      HOST_USER_ID: $PUID
      HOST_USER_GID: $PGID
      TZ: $TZ
    ports:
      - target: 20211
        published: 20211
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /home/pi/pialert/config
      - type: bind
        source: /DATA/AppData/$AppID/db
        target: /home/pi/pialert/db
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.pi-alert/assets/icon.jpg
  title:
    en_US: Pi.alert
  port_map: "20211"
  id: com.wisdomsky.coolstore.pi-alert
  index: /
  scheme: http
  version: "25"
