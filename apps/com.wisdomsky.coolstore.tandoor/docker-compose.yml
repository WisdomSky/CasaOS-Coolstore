name: tandoor
services:
  app:
    image: vabene1111/recipes:2
    restart: unless-stopped
    environment:
      SECRET_KEY: ""
      DB_ENGINE: django.db.backends.postgresql
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: casaos
      POSTGRES_PASSWORD: casaos
      POSTGRES_DB: casaos
    depends_on:
      - db
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/staticfiles
        target: /opt/recipes/staticfiles
      - type: bind
        source: /DATA/AppData/$AppID/mediafiles
        target: /opt/recipes/mediafiles
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      POSTGRES_USER: casaos
      POSTGRES_PASSWORD: casaos
      POSTGRES_DB: casaos
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/postgres/data
        target: /var/lib/postgresql/data
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.tandoor/assets/icon.svg
  title:
    en_US: Tandoor
  port_map: "8080"
  id: com.wisdomsky.coolstore.tandoor
  index: /
  scheme: http
  version: "2"
