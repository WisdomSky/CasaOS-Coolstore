name: tandoor
services:
  app:
    image: vabene1111/recipes:2@sha256:d458efd01d03bb34860180224bda58b39298c4d80826b69c856b0a844f4be727
    restart: unless-stopped
    environment:
      SECRET_KEY: ""
      DB_ENGINE: django.db.backends.postgresql
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: casaos
      POSTGRES_PASSWORD: casaos
      POSTGRES_DB: casaos
    depends_on:
      - db
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/staticfiles
        target: /opt/recipes/staticfiles
      - type: bind
        source: /DATA/AppData/$AppID/mediafiles
        target: /opt/recipes/mediafiles
  db:
    image: postgres:19.0@sha256:7a2d71c02bf63a2296900a86e9a2c889a3eea22f9004e1ea343ceb4586aa57e6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      POSTGRES_USER: casaos
      POSTGRES_PASSWORD: casaos
      POSTGRES_DB: casaos
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/postgres/data
        target: /var/lib/postgresql/data
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.tandoor/assets/icon.svg
  title:
    en_US: Tandoor
  port_map: "8080"
  id: com.wisdomsky.coolstore.tandoor
  index: /
  scheme: http
  version: "2"
