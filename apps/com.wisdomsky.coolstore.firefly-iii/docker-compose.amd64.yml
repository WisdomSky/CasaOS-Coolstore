name: firefly-iii
services:
  app:
    image: fireflyiii/core:version-6.7.9@sha256:321dc39c1d956aaf67d8adbfa48485190361d6d51640bafb9c029c48f296374d
    restart: unless-stopped
    ports:
      - target: 8080
        published: "8080"
        protocol: tcp
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: 0123456789abcdef0123456789abcdef
      APP_URL: http://localhost:8080
      SITE_OWNER: admin@example.com
      DEFAULT_LANGUAGE: en_US
      DEFAULT_LOCALE: equal
      TZ: $TZ
      TRUSTED_PROXIES: "**"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD: casaos
      CACHE_STORE: file
      SESSION_DRIVER: file
      STATIC_CRON_TOKEN: abcdef0123456789abcdef0123456789
    volumes:
      - type: bind
        source: /DATA/AppData/firefly-iii/upload
        target: /var/www/html/storage/upload
    depends_on:
      - db
  db:
    image: mariadb:11.8.9@sha256:8a4a99eff981d95c3ab12d019b82fe59725fb7761f1f9a5f155bc3f025528f4f
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: casaos
      MARIADB_DATABASE: firefly
      MARIADB_USER: firefly
      MARIADB_PASSWORD: casaos
    volumes:
      - type: bind
        source: /DATA/AppData/firefly-iii/db
        target: /var/lib/mysql
  cron:
    image: alpine:latest@sha256:c26612752c78b18faacd63c7d50f4592c2e7b0f25e0e20e82bd74e465c57ab0d
    restart: unless-stopped
    depends_on:
      - app
    environment:
      TZ: $TZ
      STATIC_CRON_TOKEN: abcdef0123456789abcdef0123456789
    command:
      - sh
      - "-c"
      - apk add --no-cache tzdata && (ln -s /usr/share/zoneinfo/$$TZ /etc/localtime || true) && echo "0 3 * * * wget -qO- http://app:8080/api/v1/cron/$$STATIC_CRON_TOKEN;echo" | crontab - && crond -f -L /dev/stdout
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.firefly-iii/assets/icon.png
  title:
    en_US: Firefly III
  id: com.wisdomsky.coolstore.firefly-iii
  index: /
  port_map: "8080"
  scheme: http
  version: 6.7.9
