name: komga
services:
  app:
    image: gotson/komga:1.30.1@sha256:2c439e73f8ca9e1cc91b4a00c31ecbe255e8d15f0c337d8cf0a2d18d88f0bc6d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 25600
        published: 25600
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.komga/assets/icon.png
  title:
    en_US: Komga
  port_map: "25600"
  id: com.wisdomsky.coolstore.komga
  index: /
  scheme: http
  version: 1.30.1
