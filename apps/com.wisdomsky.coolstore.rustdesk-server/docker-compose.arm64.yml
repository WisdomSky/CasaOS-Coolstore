    image: rustdesk/rustdesk-server-s6:1@sha256:cec7df9c71f11a8e6979d88e01417cddc335f6341c53f838ee07225e2e3fffa9
    entrypoint:
      - /usr/bin/hbbs
    volumes:
      - type: bind
        source: /DATA/AppData/rustdesk/data
