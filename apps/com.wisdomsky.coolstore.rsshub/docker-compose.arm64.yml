name: rsshub
services:
  app:
    image: diygod/rsshub:2026-11-09@sha256:dcb2ab2e110a21cddcb39c9ea94cd02b6482a562cb8c4e07918fb01f4c14d32c
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379/
      PUPPETEER_WS_ENDPOINT: ws://browserless:3000
    ports:
      - target: 1200
        published: 1200
        protocol: tcp
    depends_on:
      - redis
      - browserless
  browserless:
    image: browserless/chrome:1-puppeteer-10.4.0@sha256:8c26d8b423608d23f16ebc6bc18a32d54df48906d34c3af88899e4a973336bbd
    restart: unless-stopped
    ulimits:
      core:
        hard: 0
        soft: 0
  redis:
    image: redis:8.8.4-alpine@sha256:03653329c825af4e7e683e48e38f09d6130d95d65f3dd9e4bb2105561f1684c9
    restart: always
    volumes:
      - type: bind
        source: /DATA/AppData/rsshub/redis
        target: /data
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.rsshub/assets/icon.png
  title:
    en_US: RSShub
  port_map: "1200"
  id: com.wisdomsky.coolstore.rsshub
  index: /
  scheme: http
  version: "2026-11-09"
