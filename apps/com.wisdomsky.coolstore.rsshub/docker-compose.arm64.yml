name: rsshub
services:
  app:
    image: diygod/rsshub:2026-11-10@sha256:8cf689ca2fd09f901f91fc0c808bac29e3fdee539ef60fe5e639c80512a4e826
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379/
      PUPPETEER_WS_ENDPOINT: ws://browserless:3000
    ports:
      - target: 1200
        published: 1200
        protocol: tcp
    depends_on:
      - redis
      - browserless
  browserless:
    image: browserless/chrome:1-puppeteer-10.4.0@sha256:8c26d8b423608d23f16ebc6bc18a32d54df48906d34c3af88899e4a973336bbd
    restart: unless-stopped
    ulimits:
      core:
        hard: 0
        soft: 0
  redis:
    image: redis:7.4-alpine@sha256:52d1ea8a654b10f06af3ecda4e9dbcd035c7868b5c49ee7975de917f81de13db
    restart: always
    volumes:
      - type: bind
        source: /DATA/AppData/rsshub/redis
        target: /data
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.rsshub/assets/icon.png
  title:
    en_US: RSShub
  port_map: "1200"
  id: com.wisdomsky.coolstore.rsshub
  index: /
  scheme: http
  version: "2026-11-10"
