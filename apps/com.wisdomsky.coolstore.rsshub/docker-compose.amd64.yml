name: rsshub
services:
  app:
    image: diygod/rsshub:2026-11-10@sha256:b91fda5bb5769788440fc65709cadf61d726fe9da2bb0f3cfdc735fa0dc3a7fe
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379/
      PUPPETEER_WS_ENDPOINT: ws://browserless:3000
    ports:
      - target: 1200
        published: 1200
        protocol: tcp
    depends_on:
      - redis
      - browserless
  browserless:
    image: browserless/chrome:1-puppeteer-10.4.0@sha256:8c26d8b423608d23f16ebc6bc18a32d54df48906d34c3af88899e4a973336bbd
    restart: unless-stopped
    ulimits:
      core:
        hard: 0
        soft: 0
  redis:
    image: redis:7.4-alpine@sha256:e4ee3e03ce8f75471f40937a7c6b2b0e500390b6812fcdf5cb32c01295ded446
    restart: always
    volumes:
      - type: bind
        source: /DATA/AppData/rsshub/redis
        target: /data
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.rsshub/assets/icon.png
  title:
    en_US: RSShub
  port_map: "1200"
  id: com.wisdomsky.coolstore.rsshub
  index: /
  scheme: http
  version: "2026-11-10"
