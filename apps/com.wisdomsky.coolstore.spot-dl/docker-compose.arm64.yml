name: spot-dl
services:
  app:
    image: spotdl/spotify-downloader:v4.6.0@sha256:70c7d4de51575f740d5d55c7e3debc4bb5d7666841eec9c54991dfd25ffc1cb1
    restart: unless-stopped
    ports:
      - target: 8800
        published: 8800
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/Media/Music
        target: /music
      - type: bind
        source: /DATA/AppData/coolstore-spotdl/config
        target: /config
    command:
      - web
      - "--host"
      - 0.0.0.0
      - "--port"
      - "8800"
      - "--web-use-output-dir"
    tty: true
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.spot-dl/assets/icon.svg
  title:
    en_US: spotDL
  port_map: "8800"
  id: com.wisdomsky.coolstore.spot-dl
  index: /
  scheme: http
  version: 4.6.0
