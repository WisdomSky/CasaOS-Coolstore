name: statping
services:
  app:
    image: statping/statping
    restart: always
    depends_on:
      - db
    environment:
      VIRTUAL_PORT: 8080
      DB_CONN: postgres
      DB_HOST: db
      DB_USER: casaos
      DB_PASS: casaos
      DB_DATABASE: casaos
      NAME: ""
      DESCRIPTION: ""
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/app
        target: /app
  db:
    image: postgres:19.0@sha256:7a2d71c02bf63a2296900a86e9a2c889a3eea22f9004e1ea343ceb4586aa57e6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      POSTGRES_USER: casaos
      POSTGRES_PASSWORD: casaos
      POSTGRES_DB: casaos
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/postgres/data
        target: /var/lib/postgresql/data
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.statping/assets/icon.png
  title:
    en_US: Statping
  port_map: "8080"
  id: com.wisdomsky.coolstore.statping
  index: /
  scheme: http
  version: 0.90.74
