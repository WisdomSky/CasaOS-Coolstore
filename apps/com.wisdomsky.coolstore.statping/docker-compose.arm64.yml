name: statping
services:
  app:
    image: statping/statping:v0.90.74@sha256:fdc52496e7b70ea0d54e7c8dd26837333576a930d3edc9107d66bf802c2373eb
    restart: always
    depends_on:
      - db
    environment:
      VIRTUAL_PORT: 8080
      DB_CONN: postgres
      DB_HOST: db
      DB_USER: casaos
      DB_PASS: casaos
      DB_DATABASE: casaos
      NAME: ""
      DESCRIPTION: ""
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/app
        target: /app
  db:
    image: postgres:14.24@sha256:6e2302670f95ac5312dd7c9b78e5c7a5ef5e983c8f896599341cc48ef3d20cdf
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      POSTGRES_USER: casaos
      POSTGRES_PASSWORD: casaos
      POSTGRES_DB: casaos
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/postgres/data
        target: /var/lib/postgresql/data
x-casaos:
  main: app
  icon: https://cdn.jsdelivr.net/gh/WisdomSky/CasaOS-Coolstore@gh-pages/apps/com.wisdomsky.coolstore.statping/assets/icon.png
  title:
    en_US: Statping
  port_map: "8080"
  id: com.wisdomsky.coolstore.statping
  index: /
  scheme: http
  version: 0.90.74
