name: stirling-pdf
services:
  app:
    image: frooodle/s-pdf:3.2.2
    restart: unless-stopped
    environment:
      APP_HOME_NAME: Stirling PDF
      LANG: en_US.UTF-8
      LANGUAGE: en_US:en
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Stirling-PDF is a locally hosted web application that allows you to perform various operations on PDF files, such as splitting and adding images.
  tagline:
    en_US: Stirling-PDF is a locally hosted web application that allows you to perform various operations on PDF files, such as splitting and adding images.
  developer: Frooodle
  author: WisdomSky
  screenshot_link:
    - https://raw.githubusercontent.com/Stirling-Tools/Stirling-PDF/main/docs/images/home.png
  icon: https://raw.githubusercontent.com/Stirling-Tools/Stirling-PDF/main/docs/stirling.png
  thumbnail: https://raw.githubusercontent.com/Stirling-Tools/Stirling-PDF/main/docs/stirling.png
  title:
    en_US: Stirling PDF
  category: Productivity
  port_map: "8080"
  id: com.wisdomsky.coolstore.stirling-pdf
  index: /
  scheme: http
  version: 3.2.2
  update_at: "2026-10-31"
