name: krusader
services:
  app:
    image: binhex/arch-krusader:latest
    restart: unless-stopped
    privileged: true
    ports:
      - target: 6080
        published: "6080"
        protocol: tcp
      - target: 5900
        published: "5900"
        protocol: tcp
    environment:
      TEMP_FOLDER: /config/krusader/tmp
      WEBPAGE_TITLE: Krusader
      VNC_PASSWORD: casaos
      ENABLE_STARTUP_SCRIPTS: "no"
      UMASK: "022"
      WEBUI_PORT: "6080"
      PUID: $PUID
      PGID: $PGID
    volumes:
      - type: bind
        source: /DATA/AppData/krusader/config
        target: /config
      - type: bind
        source: /DATA
        target: /DATA
      - type: bind
        source: /mnt
        target: /mnt
      - type: bind
        source: /media
        target: /media
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
x-casaos:
  architectures:
    - amd64
  main: app
  description:
    en_US: Krusader is a KDE orthodox file manager with archive support, FTP, search, sync, and a dual-pane workflow. This image exposes it through noVNC and a VNC server.
  tagline:
    en_US: Twin-panel file manager in your browser.
  developer: KDE
  author: WisdomSky
  icon: https://raw.githubusercontent.com/KDE/krusader/master/app/icons/128-apps-krusader_root.png
  thumbnail: https://raw.githubusercontent.com/KDE/krusader/master/app/icons/128-apps-krusader_root.png
  category: Productivity
  tips:
    before_install:
      en_US: The VNC password is `casaos`. Krusader runs privileged and can access `/DATA`, `/mnt`, and `/media`, so keep it on a trusted network. The app is amd64-only.
  title:
    en_US: Krusader
  id: com.wisdomsky.coolstore.krusader
  index: /vnc.html?resize=remote&autoconnect=1
  port_map: "6080"
  scheme: http
  version: latest
  update_at: "2026-10-31"
