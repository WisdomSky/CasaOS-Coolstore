name: caddy
services:
  app:
    image: caddy:2.11.7
    restart: unless-stopped
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
      - target: 2019
        published: 2019
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/caddy/data
        target: /data
      - type: bind
        source: /DATA/AppData/caddy/config
        target: /config
      - type: bind
        source: /DATA/AppData/caddy/caddyfile
        target: /etc/caddy/caddyfile
x-casaos:
  architectures:
    - amd64
    - arm
    - arm64
  main: app
  description:
    en_US: Caddy - The Ultimate Server with Automatic HTTPS.
  tagline:
    en_US: Caddy - The Ultimate Server With Automatic Https.
  developer: Caddy
  author: WisdomSky
  icon: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/caddy.png
  thumbnail: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/caddy.png
  title:
    en_US: Caddy
  category: Networking
  port_map: "80"
  id: com.wisdomsky.coolstore.caddy
  index: /
  scheme: http
  version: 2.11.7
  update_at: "2026-10-30"
