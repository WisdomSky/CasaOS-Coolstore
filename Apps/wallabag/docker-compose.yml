name: wallabag
services:
  app:
    image: wallabag/wallabag:2.6.15
    restart: unless-stopped
    environment:
      SYMFONY__ENV__DATABASE_DRIVER: pdo_mysql
      SYMFONY__ENV__DATABASE_HOST: db
      SYMFONY__ENV__DATABASE_PORT: 3306
      SYMFONY__ENV__DATABASE_NAME: wallabag
      SYMFONY__ENV__DATABASE_USER: wallabag
      SYMFONY__ENV__DATABASE_PASSWORD: casaos
      SYMFONY__ENV__DATABASE_CHARSET: utf8mb4
      SYMFONY__ENV__DATABASE_TABLE_PREFIX: wallabag_
      SYMFONY__ENV__SECRET: casaos-wallabag-secret-change-me
      SYMFONY__ENV__DOMAIN_NAME: http://localhost:8080
      SYMFONY__ENV__SERVER_NAME: Wallabag
      SYMFONY__ENV__MAILER_DSN: smtp://127.0.0.1
      SYMFONY__ENV__FROM_EMAIL: wallabag@example.com
    depends_on:
      - db
      - redis
    ports:
      - target: 80
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/Wallabag/images
        target: /var/www/wallabag/web/assets/images
  db:
    image: mariadb:10.11.19
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: casaos
      MARIADB_DATABASE: wallabag
      MARIADB_USER: wallabag
      MARIADB_PASSWORD: casaos
    volumes:
      - type: bind
        source: /DATA/AppData/Wallabag/mysql
        target: /var/lib/mysql
  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/Wallabag/redis
        target: /data
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: "wallabag is a self hostable application for saving web pages: Save and classify articles. Read them later. Freely."
  tagline:
    en_US: "Wallabag Is A Self Hostable Application For Saving Web Pages: Save And Classify Articles. Read Them Later. Freely."
  developer: Wallabag
  author: WisdomSky
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/wallabag.png
  thumbnail: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/wallabag.png
  tips:
    before_install:
      en_US: |
        After installation, open the app settings and update `SYMFONY__ENV__DOMAIN_NAME` to your CasaOS address, for example `http://192.168.1.10:8080`.
  title:
    en_US: Wallabag
  category: Productivity
  id: com.wisdomsky.coolstore.wallabag
  index: /
  port_map: "8080"
  scheme: http
  version: 2.6.15
  update_at: "2026-10-31"
