name: readerr
services:
  app:
    image: hotio/readarr
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: ""
        - container: PGID
          description:
            en_US: ""
        - container: TZ
          description:
            en_US: ""
    ports:
      - target: 8787
        published: 8787
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /portainer/downloads
        target: /downloads
      - type: bind
        source: /portainer/books
        target: /books
x-casaos:
  architectures:
    - amd64
    - arm
    - arm64
  main: app
  description:
    en_US: Readarr usent server
  tagline:
    en_US: Readarr Usent Server
  developer: Readarr
  author: WisdomSky
  icon: https://raw.githubusercontent.com/Readarr/Readarr/develop/Logo/128.png
  thumbnail: https://raw.githubusercontent.com/Readarr/Readarr/develop/Logo/128.png
  title:
    en_US: Readarr
  category: Media
  port_map: "8787"
  id: com.wisdomsky.coolstore.readerr
  index: /
  scheme: http
  version: latest
  update_at: "2026-10-31"
