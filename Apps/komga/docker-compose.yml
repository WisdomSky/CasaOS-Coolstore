name: komga
services:
  app:
    image: gotson/komga:1.29.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: ""
        - container: PGID
          description:
            en_US: ""
    ports:
      - target: 25600
        published: 25600
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
x-casaos:
  architectures:
    - amd64
    - arm
    - arm64
  main: app
  description:
    en_US: Koomga Manga, Comic and E-Book Server
  tagline:
    en_US: Koomga Manga, Comic And E-book Server
  developer: Gotson
  author: WisdomSky
  icon: https://raw.githubusercontent.com/gotson/komga/master/.github/readme-images/app-icon.png
  thumbnail: https://raw.githubusercontent.com/gotson/komga/master/.github/readme-images/app-icon.png
  title:
    en_US: Komga
  category: Media
  port_map: "25600"
  id: com.wisdomsky.coolstore.komga
  index: /
  scheme: http
  version: 1.29.2
  update_at: "2026-10-30"
