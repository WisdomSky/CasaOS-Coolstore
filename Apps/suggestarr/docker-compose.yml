name: suggestarr
services:
  app:
    image: ciuse99/suggestarr:v3.2.0
    restart: unless-stopped
    ports:
      - target: 4455
        published: "4455"
        protocol: tcp
    environment:
      SUGGESTARR_PORT: "4455"
      LOG_LEVEL: INFO
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/suggestarr/config_files
        target: /app/config/config_files
    healthcheck:
      test:
        - CMD
        - python
        - "-c"
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:4455/api/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Reads recently watched media from Plex, Jellyfin, or Emby, finds similar titles via TMDb or an LLM, and sends requests to Seer. Includes scheduling, approval controls, filters, and cleanup automation.
  tagline:
    en_US: Recommendations from your watch history, straight to Seer.
  developer: giuseppe99barchetta
  author: WisdomSky
  icon: https://raw.githubusercontent.com/giuseppe99barchetta/SuggestArr/main/unraid/logo.png
  thumbnail: https://raw.githubusercontent.com/giuseppe99barchetta/SuggestArr/main/unraid/logo.png
  category: Media
  tips:
    before_install:
      en_US: The first-run wizard asks for a TMDb API key and your media server and Seer details. Back up `/DATA/AppData/suggestarr/config_files` before updates.
  title:
    en_US: SuggestArr
  id: com.wisdomsky.coolstore.suggestarr
  index: /
  port_map: "4455"
  scheme: http
  version: 3.2.0
  update_at: "2026-10-30"
