name: retroarch-web
services:
  app:
    image: inglebard/retroarch-web:latest
    restart: unless-stopped
    environment:
      ROOT_WWW_PATH: /var/www/html
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
x-casaos:
  architectures:
    - amd64
    - arm64
    - arm
  main: app
  description:
    en_US: Online retro games emulator.The RetroArch Web Player is RetroArch compiled through Emscripten.
  tagline:
    en_US: Online retro games emulator.
  developer: Libretro
  author: WisdomSky
  icon: https://avatars.githubusercontent.com/u/1812827
  thumbnail: https://avatars.githubusercontent.com/u/1812827
  category: Others
  title:
    en_US: RetroArch-web
  port_map: "8080"
  id: com.wisdomsky.coolstore.retroarch-web
  index: /
  scheme: http
  version: latest
  update_at: "2026-10-31"
