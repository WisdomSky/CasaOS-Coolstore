name: kavita
services:
  app:
    image: jvmilazz0/kavita:0.9.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: ""
        - container: PGID
          description:
            en_US: ""
    ports:
      - target: 5000
        published: 5000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/manga
        target: /manga
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /kavita/config
x-casaos:
  architectures:
    - amd64
    - arm
    - arm64
  main: app
  description:
    en_US: Kavita Manga, Comic and E-Book Server
  tagline:
    en_US: Kavita Manga, Comic And E-book Server
  developer: Kareadita
  author: WisdomSky
  icon: https://raw.githubusercontent.com/Kareadita/Kavita/main/UI/Web/src/assets/images/logo.png
  thumbnail: https://raw.githubusercontent.com/Kareadita/Kavita/main/UI/Web/src/assets/images/logo.png
  title:
    en_US: Kavita
  category: Media
  id: com.wisdomsky.coolstore.kavita
  index: /
  port_map: "5000"
  scheme: http
  version: 0.9.1
  update_at: "2026-10-30"
