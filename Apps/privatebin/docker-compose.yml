name: privatebin
services:
  app:
    image: privatebin/nginx-fpm-alpine:2.1.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: ""
        - container: PGID
          description:
            en_US: ""
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /srv/data
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /srv/cfg
x-casaos:
  architectures:
    - amd64
    - arm
    - arm64
  main: app
  description:
    en_US: PrivateBin is a minimalist, open source online pastebin where the server has zero knowledge of pasted data!
  tagline:
    en_US: |
      Privatebin Is A Minimalist, Open Source Online Pastebin Where The Server Has Zero Knowledge Of Pasted Data!
  developer: PrivateBin
  author: WisdomSky
  icon: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/privatebin.png
  thumbnail: https://raw.githubusercontent.com/pi-hosted/pi-hosted/master/images/privatebin.png
  title:
    en_US: Privatebin
  category: Productivity
  port_map: "8080"
  id: com.wisdomsky.coolstore.privatebin
  index: /
  scheme: http
  version: 2.1.0
  update_at: "2026-10-30"
