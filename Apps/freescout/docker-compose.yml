name: freescout
services:
  app:
    image: nfrastack/freescout:2.2.23
    restart: unless-stopped
    ports:
      - target: 80
        published: "8080"
        protocol: tcp
    environment:
      CONTAINER_NAME: freescout-app
      TIMEZONE: $TZ
      APP_URL: http://localhost:8080
      DB_TYPE: mariadb
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: freescout
      DB_USER: freescout
      DB_PASS: casaos
      ADMIN_EMAIL: admin@example.com
      ADMIN_FIRST_NAME: FreeScout
      ADMIN_LAST_NAME: Admin
      ADMIN_PASS: casaos
      SCHEDULER_TYPE: service
      FREESCOUT_APP_LOCALE: en
      FREESCOUT_MAIL_DRIVER: log
    volumes:
      - type: bind
        source: /DATA/AppData/freescout/data
        target: /data
      - type: bind
        source: /DATA/AppData/freescout/logs
        target: /logs
    depends_on:
      - db
  db:
    image: mariadb:11.8.9
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: casaos
      MARIADB_DATABASE: freescout
      MARIADB_USER: freescout
      MARIADB_PASSWORD: casaos
    volumes:
      - type: bind
        source: /DATA/AppData/freescout/db
        target: /var/lib/mysql
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: FreeScout is a lightweight shared mailbox and help desk with conversations, assignments, modules, and customer management. It can pull mail over IMAP and send via SMTP.
  tagline:
    en_US: Self-hosted help desk and shared inbox.
  developer: FreeScout
  author: WisdomSky
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/freescout.png
  thumbnail: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/freescout.png
  category: Productivity
  tips:
    before_install:
      en_US: The initial admin is `admin@example.com` with password `casaos`. Change it after first login. Set `APP_URL` to your CasaOS address and configure IMAP/SMTP in the app settings for real mail flow.
  title:
    en_US: FreeScout
  id: com.wisdomsky.coolstore.freescout
  index: /
  port_map: "8080"
  scheme: http
  version: 2.2.23
  update_at: "2026-10-31"
