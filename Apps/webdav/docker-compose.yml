name: webdav
services:
  app:
    image: derkades/webdav:latest
    restart: unless-stopped
    environment:
      USERNAME: casaos
      PASSWORD: casaos
    ports:
      - target: 80
        published: 8080
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/Documents
        target: /data
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  description:
    en_US: Web-based distributed authoring and versioning (WebDAV) is a set of extensions to the HTTP protocol that allows WebDAV clients (such as Microsoft Web Folders) to collaboratively edit and manage files on remote Web servers.
  tagline:
    en_US: Web-based distributed authoring and versioning (WebDAV) is a set of extensions to the HTTP protocol that allows WebDAV clients (such as Microsoft Web Folders) to collaboratively edit and manage files on remote Web servers.
  developer: Derkades
  author: WisdomSky
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/webdav.png
  thumbnail: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/webdav.png
  category: Productivity
  tips:
    before_install:
      en_US: |
        | Label | Value |
        | --- | --- |
        | Username | `casaos` |
        | Password | `casaos` |
        | Port | `8080` |
        | Files Path | `/DATA/Documents` |
  title:
    en_US: WebDAV
  id: com.wisdomsky.coolstore.webdav
  index: /
  port_map: "8080"
  scheme: http
  version: latest
  update_at: "2026-10-30"
