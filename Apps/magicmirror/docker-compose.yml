name: magicmirror
services:
  app:
    image: karsten13/magicmirror:alpine-v2.38.0
    restart: unless-stopped
    ports:
      - target: 8080
        published: "8080"
        protocol: tcp
    environment:
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/magicmirror/config
        target: /opt/magic_mirror/config
x-casaos:
  architectures:
    - amd64
    - arm64
    - arm
  main: app
  description:
    en_US: Open-source modular smart-mirror platform with clock, weather, calendar, news, and hundreds of community modules. Runs headless in server-only mode and renders in any browser.
  tagline:
    en_US: Turn a mirror into a modular smart display.
  developer: MagicMirrorOrg
  author: WisdomSky
  icon: https://raw.githubusercontent.com/MagicMirrorOrg/MagicMirror/master/favicon.svg
  thumbnail: https://raw.githubusercontent.com/MagicMirrorOrg/MagicMirror/master/favicon.svg
  category: Home
  tips:
    before_install:
      en_US: MagicMirror has no authentication. Keep it on a trusted LAN. Edit `/DATA/AppData/magicmirror/config/config.js` to add modules, calendars, and news feeds.
  title:
    en_US: MagicMirror²
  id: com.wisdomsky.coolstore.magicmirror
  index: /
  port_map: "8080"
  scheme: http
  version: 2.38.0
  update_at: "2026-10-30"
